name: "Tests"

on:
    push:
        branches:
            - main
    pull_request:
        paths-ignore:
            - "**.md?"

jobs:
    unit_tests:
        name: "unit_tests (node: ${{ matrix.node }})"
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [20]
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: "TupiC/blocks-renderer-angular"
                  persist-credentials: false
            - uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node }}
            - name: "Run install"
              run: npm install
            - name: "Run tests"
              run: npm run test
