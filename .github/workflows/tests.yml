name: 'Tests'

on:
    push:
        branches:
            - main
    pull_request:
        paths-ignore:
            - '**.md?'

jobs:
    unit_tests:
        name: 'unit_tests (node: ${{ matrix.node }})'
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [20]
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: 'TupiC/blocks-renderer-angular'
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
              with:
                  version: '11.13.1'
                  run_install: false
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: 'pnpm'
            - name: 'Run install'
              run: pnpm install --frozen-lockfile
            - name: 'Run tests'
              run: pnpm test
